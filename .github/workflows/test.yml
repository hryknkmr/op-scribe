name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Unit tests (privacy filter, step rendering)
        run: node --test tests/*.test.mjs
      - name: Manifest is valid JSON and files it references exist
        run: |
          node -e "
            const m = require('./manifest.json'); const fs = require('fs');
            const files = [m.background.service_worker, m.side_panel.default_path, ...Object.values(m.icons)];
            const missing = files.filter((f) => !fs.existsSync(f));
            if (missing.length) { console.error('missing:', missing); process.exit(1); }
          "

  # The extension in a real Chromium, on made-up sites (e2e/fixtures.mjs).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      # No lockfile in the repository (.gitignore): Playwright is pinned in package.json.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (recording, WebMCP)
        run: pnpm e2e
