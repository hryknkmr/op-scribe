name: PII Guard

# 公開リポジトリへの PII / 社内情報 / secret 混入の最終遮断（server 側）。
# ローカル hooks は回避できるため、branch protection で required check にすること。

on:
  # Every branch: a pushed branch is readable once the repository is public, PR or not.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pii-guard:
    name: PII / identity guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for identity scan)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan tracked files
        run: |
          chmod +x scripts/pii-guard.sh
          scripts/pii-guard.sh scan-tree || { echo "✗ tracked ファイルに PII/社内情報/secret の疑い" >&2; exit 1; }

      # PR: the PR's own commits. push: the whole history from the root commit,
      # because <root>..HEAD would leave the root commit out.
      - name: Choose the commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            echo "RANGE=${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_ENV"
          else
            echo "RANGE=HEAD" >> "$GITHUB_ENV"
          fi

      - name: Check commit identities
        run: scripts/pii-guard.sh check-identities "$RANGE"

      # On a push, only what it added: commits on main from before the display name changed
      # still carry the old name. Whether to rewrite them is decided in #20; use RANGE then.
      - name: Check commit names
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # A new branch has no before, and a force push's may not have been fetched.
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              RANGE="${BEFORE_SHA}..HEAD"
            elif [ "$GITHUB_REF" != refs/heads/main ]; then
              RANGE="origin/main..HEAD"
            fi
          fi
          scripts/pii-guard.sh check-names "$RANGE"

      # Each commit on its own: content added in one commit and removed in a later
      # one, and commit messages, never show up in the latest tree.
      - name: Scan each commit and its message
        run: scripts/pii-guard.sh scan-commits "$RANGE"
